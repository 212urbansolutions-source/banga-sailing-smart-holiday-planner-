<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Sailing season calendar</title>
  <desc id="desc">A Mediterranean sailing calendar with islands, sun, and yacht route lines.</desc>
  <defs>
