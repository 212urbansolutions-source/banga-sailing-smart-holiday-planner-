      <stop offset="0" stop-color="#b7f4ff"/>
      <stop offset="1" stop-color="#f9fff7"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#54d7d2"/>
      <stop offset="1" stop-color="#008da5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#sky)"/>
  <circle cx="1004" cy="126" r="82" fill="#ffc800"/>
